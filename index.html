  <body>
    <!-- Pre-React error trap: catches module-level crashes before React mounts -->
    <script>
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');
        if (root && !root.children.length) {
          root.innerHTML = '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0a0a0f;color:#f8f8f8;font-family:monospace;padding:2rem;text-align:center;gap:1rem"><div style="font-size:2rem">🔴</div><h2 style="color:#a78bfa;font-size:1.2rem">JS Error (pre-React)</h2><pre style="background:#1a1a2e;padding:1rem;border-radius:8px;max-width:700px;overflow:auto;font-size:0.8rem;text-align:left;color:#fca5a5">' + (e.message || 'Unknown error') + '\n\nFile: ' + e.filename + '\nLine: ' + e.lineno + '</pre><button onclick="location.reload()" style="padding:10px 24px;border-radius:8px;border:none;cursor:pointer;background:linear-gradient(135deg,#7c3aed,#a78bfa);color:#fff;font-weight:600;margin-top:1rem">Reload</button></div>';
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        var root = document.getElementById('root');
        if (root && !root.children.length) {
          root.innerHTML = '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0a0a0f;color:#f8f8f8;font-family:monospace;padding:2rem;text-align:center;gap:1rem"><div style="font-size:2rem">🔴</div><h2 style="color:#a78bfa;font-size:1.2rem">Promise Rejection (pre-React)</h2><pre style="background:#1a1a2e;padding:1rem;border-radius:8px;max-width:700px;overflow:auto;font-size:0.8rem;text-align:left;color:#fca5a5">' + (e.reason || 'Unknown rejection') + '</pre><button onclick="location.reload()" style="padding:10px 24px;border-radius:8px;border:none;cursor:pointer;background:linear-gradient(135deg,#7c3aed,#a78bfa);color:#fff;font-weight:600;margin-top:1rem">Reload</button></div>';
        }
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
